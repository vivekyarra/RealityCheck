name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: python scripts/stress_test.py --cases 2000
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t realitycheck:test .
      - run: docker run -d --name realitycheck -p 8080:8080 realitycheck:test
      - run: |
          for i in {1..20}; do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 1
          done
          docker logs realitycheck
          exit 1
