steps:
  - name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - pip install -r requirements-dev.txt && pytest --cov=app --cov-report=term-missing --cov-fail-under=85
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/realitycheck:$COMMIT_SHA", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/realitycheck:$COMMIT_SHA"]
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - realitycheck
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/realitycheck:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=realitycheck-runtime@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=APP_ENV=production,REALITYCHECK_STORE=firestore,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_MODEL=gemini-3.5-flash,GOOGLE_GENAI_USE_VERTEXAI=TRUE,PROVIDER_MODE=simulated
      - --min-instances=0
      - --max-instances=3
      - --memory=1Gi
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/realitycheck:$COMMIT_SHA"
substitutions:
  _REGION: asia-south1
  _REPOSITORY: realitycheck
options:
  logging: CLOUD_LOGGING_ONLY
